<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="favBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14142B" />
      <stop offset="100%" stop-color="#070712" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#favBg)" stroke="url(#favBorder)" stroke-width="2.5" />

  <!-- Left Circle Loop -->
  <circle cx="20" cy="25" r="5" stroke="url(#favNeon)" stroke-width="2.5" fill="none" />
  <circle cx="20" cy="39" r="5" stroke="url(#favNeon)" stroke-width="2.5" fill="none" />

  <!-- Center Equalizer Transient -->
  <rect x="28.5" y="24" width="2.5" height="16" rx="1.2" fill="#00F0FF" />
  <rect x="32.5" y="18" width="2.8" height="28" rx="1.4" fill="#FFFFFF" />
  <rect x="37" y="24" width="2.5" height="16" rx="1.2" fill="#3B82F6" />

  <!-- Right Circle Loop -->
  <circle cx="44" cy="25" r="5" stroke="url(#favNeon)" stroke-width="2.5" fill="none" />
  <circle cx="44" cy="39" r="5" stroke="url(#favNeon)" stroke-width="2.5" fill="none" />
</svg>
