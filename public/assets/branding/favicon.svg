<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="favGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#8A2BE2" />
    </linearGradient>
    <linearGradient id="favBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="1" y="1" width="46" height="46" rx="14" fill="#070712" stroke="url(#favBorder)" stroke-width="2" />
  
  <!-- Stylized 808 Bass Emblem -->
  <circle cx="16" cy="18" r="4.5" stroke="url(#favGradient)" stroke-width="2" fill="none" />
  <circle cx="16" cy="30" r="4.5" stroke="url(#favGradient)" stroke-width="2" fill="none" />

  <!-- Center Equalizer Bars -->
  <rect x="21.5" y="17" width="2" height="14" rx="1" fill="#00F0FF" filter="url(#favGlow)" />
  <rect x="25" y="13" width="2" height="22" rx="1" fill="#FFFFFF" />

  <!-- Right '8' -->
  <circle cx="34" cy="18" r="4.5" stroke="url(#favGradient)" stroke-width="2" fill="none" />
  <circle cx="34" cy="30" r="4.5" stroke="url(#favGradient)" stroke-width="2" fill="none" />
</svg>
