<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>808 Beat Store | Premium Hip-Hop Beats</title>
    <meta name="description" content="Explore exclusive and non-exclusive premium hip-hop beats from 808 Beat Store. High-fidelity instrumentals with multi-track stems and instant commercial licensing." />
    <link rel="icon" type="image/svg+xml" href="/assets/branding/favicon.svg" />
    
    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="808 Beat Store | Premium Hip-Hop Beats" />
    <meta property="og:description" content="High-fidelity hip-hop instrumentals with multi-track stems and instant commercial licensing from 808 Beat Store." />
    <meta property="og:image" content="/assets/branding/producer-logo.svg" />
    
    <!-- Google Fonts: Inter & Outfit (Only 2 families, 3 weights with font-display: swap) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@700&display=swap" rel="stylesheet" />


    <!-- Razorpay Standard Web Checkout -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- Pannellum 360 Panorama Viewer (Deferred) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css"/>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js" defer></script>

    <style>
      /* Prevent any white flash before CSS loads */
      html, body {
        background-color: #050505;
        color: #ffffff;
        margin: 0;
        padding: 0;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }
      /* Custom dark scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0D0D12;
      }
      ::-webkit-scrollbar-thumb {
        background: #252535;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3B3B52;
      }
    </style>
  </head>
  <body class="bg-background text-text min-h-screen antialiased selection:bg-electric-blue selection:text-white">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #05050a; color: #ffffff; font-family: 'Inter', system-ui, -apple-system, sans-serif; position: relative; overflow: hidden; padding: 20px;">
        <!-- Ambient Cosmos Glow -->
        <div style="position: absolute; width: 450px; height: 300px; background: radial-gradient(circle, rgba(0,102,255,0.18) 0%, rgba(138,43,226,0.12) 40%, transparent 70%); filter: blur(60px); pointer-events: none;"></div>

        <!-- Infinity Symbol SVG with Galaxy Effect -->
        <div style="position: relative; width: 220px; height: 110px; z-index: 1;">
          <svg viewBox="0 0 300 160" style="width: 100%; height: 100%; filter: drop-shadow(0 0 20px rgba(0, 102, 255, 0.6));" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <clipPath id="infinity-clip-pre">
                <path d="M 150,80 C 115,35 45,35 45,80 C 45,125 115,125 150,80 C 185,35 255,35 255,80 C 255,125 185,125 150,80 Z" fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
              </clipPath>
              <linearGradient id="galaxy-grad-pre" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00F0FF" />
                <stop offset="50%" stop-color="#8A2BE2" />
                <stop offset="100%" stop-color="#0066FF" />
              </linearGradient>
            </defs>
            <path d="M 150,80 C 115,35 45,35 45,80 C 45,125 115,125 150,80 C 185,35 255,35 255,80 C 255,125 185,125 150,80 Z" fill="none" stroke="#0a0a1a" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
            <g clip-path="url(#infinity-clip-pre)">
              <rect width="300" height="160" fill="url(#galaxy-grad-pre)" style="animation: cosmosFlowPre 3s ease-in-out infinite alternate;" />
              <circle cx="75" cy="80" r="45" fill="rgba(255,255,255,0.25)" style="animation: cosmosSpinPre 6s linear infinite; transform-origin: 75px 80px;" />
              <circle cx="225" cy="80" r="45" fill="rgba(255,255,255,0.25)" style="animation: cosmosSpinPre 6s linear infinite reverse; transform-origin: 225px 80px;" />
              <circle cx="60" cy="70" r="2" fill="#fff" />
              <circle cx="90" cy="95" r="2.5" fill="#00F0FF" />
              <circle cx="210" cy="65" r="2" fill="#fff" />
              <circle cx="240" cy="90" r="2.5" fill="#00F0FF" />
            </g>
            <path d="M 150,80 C 115,35 45,35 45,80 C 45,125 115,125 150,80 C 185,35 255,35 255,80 C 255,125 185,125 150,80 Z" fill="none" stroke="#00F0FF" stroke-width="2" stroke-dasharray="6 8" opacity="0.8" />
          </svg>
        </div>

        <!-- Typography -->
        <div style="margin-top: 16px; font-weight: 900; font-size: 17px; letter-spacing: 3.5px; text-transform: uppercase; color: #ffffff; text-shadow: 0 0 16px rgba(0,102,255,0.7); z-index: 1;">
          808 BEAT STORE
        </div>
        <div style="color: #94a3b8; font-size: 11px; margin-top: 6px; letter-spacing: 1.5px; font-family: monospace; text-transform: uppercase; z-index: 1;">
          Initializing Studio Instrumentals...
        </div>
      </div>
      <style>
        @keyframes cosmosFlowPre { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(90deg); } }
        @keyframes cosmosSpinPre { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/apps/web/src/main.tsx"></script>
  </body>
</html>
