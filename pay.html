<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>808 Beat Store | Secure Checkout & Payment</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #06060c;
      background-image: radial-gradient(circle at 50% 20%, rgba(0, 102, 255, 0.12), transparent 60%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: #0d0e1a;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 32px 28px;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 102, 255, 0.15);
      text-align: center;
      position: relative;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(52, 211, 153, 0.3);
      padding: 5px 14px;
      border-radius: 50px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 18px;
    }
    h1 {
      font-size: 24px;
      margin: 0 0 8px 0;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #ffffff, #67e8f9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94a3b8;
      font-size: 13px;
      margin: 0 0 22px 0;
      line-height: 1.5;
    }
    .order-box {
      background: #141525;
      border: 1px solid #282942;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 22px;
      text-align: left;
    }
    .order-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
      color: #94a3b8;
    }
    .order-val {
      color: #38bdf8;
      font-weight: 700;
      font-family: monospace;
    }
    .amount-val {
      color: #10b981;
      font-size: 22px;
      font-weight: 900;
      font-family: monospace;
    }
    button {
      background: linear-gradient(135deg, #0066FF, #00d4ff);
      color: #ffffff;
      border: none;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 8px 24px rgba(0, 102, 255, 0.4);
    }
    button:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    button:active {
      transform: scale(0.98);
    }
    .info-box {
      margin-top: 24px;
      background: #151522;
      border: 1px dashed #3a3a55;
      border-radius: 12px;
      padding: 16px;
      text-align: left;
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.6;
    }
    .info-box code {
      background: #252538;
      padding: 2px 6px;
      border-radius: 4px;
      color: #38bdf8;
      font-family: monospace;
      font-size: 13px;
    }
    #status-msg {
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      display: none;
      font-size: 14px;
      line-height: 1.5;
    }
    .success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10b981;
      color: #10b981;
      display: block !important;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">Verified Order Attached</div>
    <h1>808 Beat Store</h1>
    <p>Official Razorpay order attached. Click below to pay.</p>

    <div class="order-box">
      <div class="order-row">
        <span>Order ID:</span>
        <span class="order-val"><code>order_Tn8AGnB4KV2vO9</code></span>
      </div>
      <div class="order-row" style="margin-bottom: 0;">
        <span>Amount:</span>
        <span class="amount-val">₹1,999 (Test)</span>
      </div>
    </div>

    <button id="pay-button" onclick="startRazorpayPayment()">
      💳 PAY WITH TEST CARD
    </button>

    <div id="status-msg"></div>

    <div class="info-box">
      <b>Test Credentials:</b><br>
      • <b>Card:</b> <code>4100 2800 0000 1007</code><br>
      • <b>Expiry:</b> <code>12/26</code> &nbsp;|&nbsp; <b>CVV:</b> <code>123</code><br>
      • <i>OTP screen aane par <b>Success</b> button dabayein!</i>
    </div>
  </div>

  <script>
    function startRazorpayPayment() {
      var btn = document.getElementById('pay-button');
      btn.innerText = 'Opening Modal...';
      btn.disabled = true;

      var options = {
        key: 'rzp_test_Tn81seEgSBq1x6',
        amount: 199900,
        currency: 'INR',
        name: '808 Beat Store',
        description: 'Test Verification Order',
        order_id: 'order_Tn8AGnB4KV2vO9',
        prefill: {
          name: '808 Beat Store Owner',
          email: 'test@razorpay.com',
          contact: '9999999999'
        },
        theme: {
          color: '#0066FF'
        },
        handler: function(response) {
          console.log('Payment success:', response);
          var status = document.getElementById('status-msg');
          status.className = 'success';
          status.innerHTML = '🎉 <b>TEST TRANSACTION SUCCESSFUL!</b><br>Payment ID: <code>' + response.razorpay_payment_id + '</code><br>Order ID: <code>' + response.razorpay_order_id + '</code><br><br>👉 <b>Ab Razorpay Dashboard wale tab par jayein aur "I have done the transaction" par click karein!</b>';
          btn.innerText = '✓ Payment Successful';
          btn.style.background = '#10b981';
          btn.disabled = false;
          alert('Payment Successful! Payment ID: ' + response.razorpay_payment_id + '\n\nAb Razorpay Dashboard par "I have done the transaction" par click karein!');
        },
        modal: {
          ondismiss: function() {
            btn.innerText = '💳 PAY WITH TEST CARD';
            btn.disabled = false;
          }
        }
      };

      try {
        var rzp = new Razorpay(options);
        rzp.on('payment.failed', function(resp) {
          alert('Payment Failed: ' + (resp.error ? resp.error.description : 'Unknown error'));
          btn.innerText = '💳 PAY WITH TEST CARD';
          btn.disabled = false;
        });
        rzp.open();
      } catch (err) {
        alert('Could not open Razorpay modal: ' + err.message);
        btn.innerText = '💳 PAY WITH TEST CARD';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
